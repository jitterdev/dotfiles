# vim:ft=kitty

## name:     Catppuccin-Mocha (Vibrant)
## author:   Pocco81 (Modified)
## license:  MIT
## blurb:    Soothing pastel theme with distinct bright colors!

# The basic colors
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC

# Cursor colors
cursor                  #F5E0DC
cursor_text_color       #1E1E2E

# URL underline color when hovering with mouse
url_color               #F5E0DC

# Kitty window border colors
active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
tab_bar_background      #11111B

# Colors for marks (marked text in the terminal)
mark1_foreground #1E1E2E
mark1_background #B4BEFE
mark2_foreground #1E1E2E
mark2_background #CBA6F7
mark3_foreground #1E1E2E
mark3_background #74C7EC

# The 16 terminal colors

# black
color0 #45475A
color8 #585B70

# red
# Normal: Maroon, Bright: Red
color1 #EBA0AC
color9 #F38BA8

# green
# Normal: Green, Bright: Teal (Distinct enough to act as bright green)
color2  #A6E3A1
color10 #94E2D5

# yellow
# Normal: Peach, Bright: Yellow
color3  #FAB387
color11 #F9E2AF

# blue
# Normal: Blue, Bright: Lavender
color4  #89B4FA
color12 #B4BEFE

# magenta
# Normal: Mauve, Bright: Pink
color5  #CBA6F7
color13 #F5C2E7

# cyan
# Normal: Sky, Bright: Sapphire
color6  #89DCEB
color14 #74C7EC

# white
# Normal: Subtext0, Bright: Subtext1
color7  #A6ADC8
color15 #BAC2DE